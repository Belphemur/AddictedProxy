name: CI/CD

on:
  push:
    branches: [ dev, main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ dev, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PROJECT_NAME: "AddictedProxy"
  PROJECT_NAME_FRONTEND: "AddictedProxy-frontend"
  NODEJS: lts/*
  DOTNET: "10.0.x"
  sentry_project: "addictedproxy"
  SENTRY_ORG: "soundswitch"
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>

jobs:
  # Detect which parts of the repo changed so unrelated pipelines can be
  # skipped on PRs, while `main` always runs everything before a release.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet == 'true' || steps.filter.outputs.ci == 'true' || github.ref == 'refs/heads/main' }}
      nuxt: ${{ steps.filter.outputs.nuxt == 'true' || steps.filter.outputs.ci == 'true' || github.ref == 'refs/heads/main' }}
      node: ${{ steps.filter.outputs.node == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci:
             - '.github/workflows/**'
            dotnet:
              - 'Addicted*/**'
              - 'Locking/**'
              - 'InversionOfControl/**'
              - 'Compressor/**'
              - 'TvMovieDatabaseClient/**'
            node:
              - 'package.json'
            nuxt:
              - 'addicted.nuxt/**'
              - 'mock-server/**'

  # --- Required pipelines (reusable workflows) -----------------------------
  dotnet-ci:
    name: .NET
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    uses: ./.github/workflows/reusable-dotnet.yml
    with:
      dotnet-version: "10.0.x"
      project-path: "AddictedProxy/AddictedProxy.csproj"

  nuxt-ci:
    name: Nuxt
    needs: changes
    if: needs.changes.outputs.nuxt == 'true'
    uses: ./.github/workflows/reusable-nuxt.yml
    with:
      working-directory: "addicted.nuxt"
      node-version: "lts/*"

  nuxt-e2e:
    name: Nuxt E2E
    needs: changes
    if: needs.changes.outputs.nuxt == 'true'
    uses: ./.github/workflows/reusable-nuxt-e2e.yml
    with:
      working-directory: "addicted.nuxt"
      mock-server-directory: "mock-server"
      node-version: "lts/*"

  release-dry-run:
    name: Release dry-run
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        run: |
          npm i -g corepack@latest
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODEJS }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release dry run
        run: pnpm run release-test

  # --- Merge gate -----------------------------------------------------------
  # Single required status check for branch protection: it fails if any
  # required pipeline (.NET, Nuxt build, Nuxt e2e) failed, and succeeds when
  # they passed or were correctly skipped (path filtering / dry-run only).
  ci-gate:
    name: CI Gate
    needs: [ changes, dotnet-ci, nuxt-ci, nuxt-e2e, release-dry-run ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required pipeline results
        run: |
          check() {
            local name="$1"
            local result="$2"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::$name pipeline result was '$result'"
              exit 1
            fi
            echo "$name: $result"
          }
          check ".NET" "${{ needs.dotnet-ci.result }}"
          check "Nuxt build" "${{ needs.nuxt-ci.result }}"
          check "Nuxt e2e" "${{ needs.nuxt-e2e.result }}"
          check "Release dry-run" "${{ needs.release-dry-run.result }}"
          echo "All required pipelines passed (or were skipped)."

  # --- Release (main only) ---------------------------------------------------
  main-release:
    name: "Prepare release"
    needs: [ ci-gate ]
    if: github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      repo-lowercase: ${{ steps.repo.outputs.lowercase }}
    steps:
      - name: Set repo lower case
        run: |
          echo "lowercase=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT
        id: repo
      - uses: actions/checkout@v7
      - name: Install pnpm
        run: |
          npm i -g corepack@latest
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release
        run: pnpm run release
      - name: Latest Version
        run: |
          version=$(git describe --tags --abbrev=0 | cut -c 2-)
          echo "version=$version" >> $GITHUB_OUTPUT
        id: version

  sentry-release:
    name: "Setup Sentry Release"
    needs: [ main-release ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.main-release.outputs.version}}
      - name: Sentry Release
        uses: getsentry/action-release@v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{env.SENTRY_ORG}}
          SENTRY_PROJECT: ${{env.sentry_project}}
        with:
          environment: Production
          version: "${{env.PROJECT_NAME}}@${{ needs.main-release.outputs.version}}"

  docker-build-publish:
    needs: [ main-release ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: "addictedproxy"
            image: ${{ needs.main-release.outputs.repo-lowercase}}
            context: "./"
            sentry_project: "addictedproxy"
          - package: "addictedproxy-frontend"
            image: ${{ needs.main-release.outputs.repo-lowercase}}-frontend
            context: "addicted.nuxt/"
            sentry_project: "addicted-frontend"
    permissions:
      contents: read
      packages: write
      # Both used for attesting the build provenance
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: "${{ env.REGISTRY }}/${{ matrix.image }}"
          tags: |
            type=semver,pattern={{version}},value=${{ needs.main-release.outputs.version}}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image ${{ matrix.image }}
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{env.SENTRY_ORG}}
            SENTRY_PROJECT=${{ matrix.sentry_project }}
            RELEASE_VERSION=${{ needs.main-release.outputs.version}}
      - name: Attest  ${{ matrix.image }}
        uses: actions/attest-build-provenance@v4
        id: attest
        with:
          subject-name:  "${{ env.REGISTRY }}/${{ matrix.image }}"
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
